name: Create Docker Image and Deploy to Amazon ECS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The git ref to deploy (branch, tag, or commit SHA).'
        required: true
        default: 'gmpm-verdaccio'
      ecr_repository:
        description: 'The name of the ECR repository to push the Docker image to.'
        required: true
        default: 'verdaccio'
      ecs_service:
        description: 'The name of the ECS service to deploy to.'
        required: true
        default: 'verdaccio-asg-ECSService-1X9Z7K8QG2L5'
      ecs_cluster:
        description: 'The name of the ECS cluster to deploy to.'
        required: true
        default: 'verdaccio-asg-ECSCluster-ybYAOGuDHD1U'
      working-directory:
        description: 'The working directory for the Docker build context.'
        required: true
        default: 'docker-s3-storage'


env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY: ${{ github.event.inputs.ecr_repository }}
  ECS_SERVICE: ${{ github.event.inputs.ecs_service }}
  ECS_CLUSTER: ${{ github.event.inputs.ecs_cluster }}

jobs:
  build-image:
    name: Build image (push only if changed)
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.check.outputs.image_changed }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
            path: Verdaccio
            ref: ${{ github.event.inputs.ref }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-west-2'
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.4
      - name: Compute image content hash and check ECR
        id: check
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Hash everything that ends up in the image (build context files).
          # Sorted, NUL-delimited so file ordering / spaces don't change the hash.
          IMAGE_HASH=$(find . -type f -not -path './task-definition.json' \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          IMAGE_TAG="src-${IMAGE_HASH}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Computed image tag: ${IMAGE_TAG}"

          if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --region us-west-2 >/dev/null 2>&1; then
            echo "Image ${IMAGE_TAG} already exists in ECR — skipping build and deploy."
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
            echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${IMAGE_TAG} not in ECR — building and pushing."
            docker build \
              -t "${IMAGE_URI}" \
              -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
            docker push "${IMAGE_URI}"
            docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
            echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          fi
        working-directory: Verdaccio/docker-examples/v5/${{ github.event.inputs.working-directory }}

  deploy:
    name: Force new ECS deployment
    runs-on: ubuntu-latest
    needs: build-image
    if: needs.build-image.outputs.image_changed == 'true'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-west-2'
      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region us-west-2
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region us-west-2
